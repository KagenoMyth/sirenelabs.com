<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirene Labs</title>
<meta name="description" content="Sirene Labs — an independent software laboratory.">
<style>
  :root {
    --bg: #0a0a0c;
    --ink: #e8e8ea;
    --muted: #8a8a93;
    --faint: #4a4a52;
    --accent: #5eead4;
    --max: 44rem;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: var(--max);
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 1.75rem;
  }

  h1 {
    font-size: clamp(2.75rem, 8vw, 4.5rem);
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }

  h1 .dot { color: var(--accent); }

  .wave {
    display: block;
    width: 100%;
    height: 48px;
    margin: 2.25rem 0;
  }

  .wave path {
    fill: none;
    stroke: var(--faint);
    stroke-width: 1.25;
  }

  .wave path.live {
    stroke: var(--accent);
    stroke-dasharray: 90 660;
    animation: drift 9s linear infinite;
  }

  @keyframes drift {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -750; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave path.live { animation: none; stroke-dasharray: none; opacity: 0.5; }
  }

  .lede {
    font-size: 1.125rem;
    color: var(--ink);
    max-width: 34rem;
    text-wrap: pretty;
  }

  .sub {
    margin-top: 0.875rem;
    color: var(--muted);
    font-size: 1rem;
    max-width: 34rem;
    text-wrap: pretty;
  }

  .status {
    margin-top: 3rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }

  .status .key { color: var(--faint); }
  .status .val { color: var(--accent); }

  footer {
    width: 100%;
    max-width: var(--max);
    padding: 2rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.8125rem;
    color: var(--faint);
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    padding: 0.625rem 0;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    border-bottom: 1px solid transparent;
    transition: color 160ms ease, border-color 160ms ease;
  }

  footer a:hover { color: var(--accent); }
  footer a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<main>
  <p class="eyebrow mono">Sirene Labs</p>
  <h1>Software,<br>experimentally<span class="dot">.</span></h1>

  <svg class="wave" viewBox="0 0 600 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C50,4 100,4 150,24 S250,44 300,24 S400,4 450,24 S550,44 600,24"/>
    <path class="live" d="M0,24 C50,4 100,4 150,24 S250,44 300,24 S400,4 450,24 S550,44 600,24"/>
  </svg>

  <p class="lede">An independent software laboratory.</p>
  <p class="sub">We build tools, systems, and ideas worth shipping — and we follow whatever path the work opens up.</p>

  <p class="status mono"><span class="key">status:</span> <span class="val">building</span></p>
</main>

<footer>
  <span>&copy; 2026 Sirene Labs &middot; Redmond, WA</span>
  <a href="mailto:hello@sirenelabs.com">hello@sirenelabs.com</a>
</footer>

</body>
</html>
